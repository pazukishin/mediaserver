services:
  mediaserver:
    image: pazus-mediaserver:latest
    build:
      context: .
      tags:
        - pazus-mediaserver:latest
    ports:
      - "3000:3000"
      # HTTPS opcional (para instalar la PWA en Android). Quita esta línea si no
      # lo usas. TLS_PORT dentro del contenedor se puede ajustar con la variable.
      - "${TLS_PORT:-3443}:${TLS_PORT:-3443}"
    environment:
      PORT: 3000
      MEDIA_DIR: /media
      DATA_DIR: /data
      MEDIA_USER: ${MEDIA_USER:-media}
      # Sin valor por defecto a propósito: el servidor se niega a arrancar con
      # credenciales de ejemplo. Defínelas en .env (`:?` avisa si faltan).
      MEDIA_PASSWORD: ${MEDIA_PASSWORD:?define MEDIA_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET (>=32 caracteres) en .env}
      # 1 cuando hay un proxy inverso delante (HTTPS + cookie secure)
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SCAN_CONCURRENCY: ${SCAN_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # HTTPS opcional: rutas DENTRO del contenedor a los certificados montados
      # en ./certs. Déjalas vacías para servir sólo HTTP.
      TLS_CERT: ${TLS_CERT:-}
      TLS_KEY: ${TLS_KEY:-}
      TLS_PORT: ${TLS_PORT:-3443}
    volumes:
      - ./media:/media:ro
      - ./data:/data
      # Descomenta para montar los certificados (scripts/gen-certs.sh):
      # - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
