<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MediaServer">
  <defs>
    <linearGradient id="ms-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b48cff" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <radialGradient id="ms-glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#9d6bff" stop-opacity="0.2" />
